<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
   <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Lets this site be installed/launched as a standalone app and is
         what the Play Store TWA wrapper launches into (start_url: /app) -
         see public/manifest.webmanifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>PackStack | Booking Software for South African Service Businesses</title>
    <meta name="description" content="PackStack builds and runs the systems South African salons, clinics and small businesses use every day: online booking, payments, reminders and websites. One monthly fee, local support, Johannesburg." />
    <meta name="keywords" content="business software South Africa, salon booking software, appointment scheduling software, online booking system, Johannesburg, PackStack" />
    <meta name="author" content="PackStack" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://packstack.co.za" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://packstack.co.za" />
    <meta property="og:title" content="PackStack | Booking Software for South African Service Businesses" />
    <meta property="og:description" content="Online booking, payments, reminders and websites for salons, clinics and small businesses. One monthly fee, local support." />
    <meta property="og:image" content="https://packstack.co.za/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="PackStack" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://packstack.co.za" />
    <meta name="twitter:title" content="PackStack | Booking Software for South African Service Businesses" />
    <meta name="twitter:description" content="Online booking, payments, reminders and websites for salons, clinics and small businesses. One monthly fee, local support." />
    <meta name="twitter:image" content="https://packstack.co.za/og-card.png" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="ZA-GP" />
    <meta name="geo.placename" content="Johannesburg" />

    <!-- Theme color -->
    <meta name="theme-color" content="#f6f4ef" />

    <!-- Fonts: Fraunces (display), IBM Plex Sans (text/UI), IBM Plex Mono
         (labels/numbers). Loaded from Google Fonts for now - self-hosted,
         subset woff2 files are the right follow-up for the stated
         performance budget, see DESIGN.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
