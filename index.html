<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
   <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Lets this site be installed/launched as a standalone app and is
         what the Play Store TWA wrapper launches into (start_url: /app) -
         see public/manifest.webmanifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>PackStack | Business Apps for South African Companies</title>
    <meta name="description" content="PackStack is a growing platform of business apps for South African companies. Start with Booking Appointment — real-time online booking, staff scheduling, WhatsApp & email confirmations, loyalty rewards and deposit payments for salons. We also build custom web, app, SEO and social media projects." />
    <meta name="keywords" content="business software South Africa, salon booking software, appointment scheduling software, online booking system, Johannesburg, PackStack" />
    <meta name="author" content="PackStack" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://packstack.co.za" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://packstack.co.za" />
    <meta property="og:title" content="PackStack | Business Apps for South African Companies" />
    <meta property="og:description" content="A growing platform of business apps for South African companies, starting with Booking Appointment for salons and service businesses." />
    <!-- Stopgap - no designed 1200x630 social card exists yet, this is
         just a real, existing image so the preview isn't broken. Replace
         with a proper designed card when one exists. -->
    <meta property="og:image" content="https://packstack.co.za/hero-bg.jpg" />
    <meta property="og:site_name" content="PackStack" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://packstack.co.za" />
    <meta name="twitter:title" content="PackStack | Business Apps for South African Companies" />
    <meta name="twitter:description" content="A growing platform of business apps for South African companies, starting with Booking Appointment for salons and service businesses." />
    <meta name="twitter:image" content="https://packstack.co.za/hero-bg.jpg" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="ZA-GP" />
    <meta name="geo.placename" content="Johannesburg" />

    <!-- Theme color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
